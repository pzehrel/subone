services:
  subone:
    image: subone:local
    build: .
    container_name: subone
    restart: unless-stopped
    init: true
    ports:
      - "${SUBONE_PORT:-3456}:3456"
    environment:
      PORT: "3456"
      NODE_ENV: production
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates
