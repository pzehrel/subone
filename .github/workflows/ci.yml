name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: bash -n install.sh && sh -n docker-entrypoint.sh
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: subone:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check container startup
        run: |
          docker run -d --name subone-ci -p 127.0.0.1:3456:3456 -v subone-ci-data:/app/data -v subone-ci-templates:/app/templates subone:ci
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3456/api/auth/status
          curl --fail http://127.0.0.1:3456/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3456/sub/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3456/api/missing)" = 404
          test "$(docker exec subone-ci cat /proc/1/status | awk '/^Uid:/ { print $2 }')" != 0
          curl --fail -H 'Content-Type: application/json' -d '{"newPassword":"ci-test-password"}' http://127.0.0.1:3456/api/auth/change-password
          docker rm -f subone-ci
          docker run -d --name subone-ci -p 127.0.0.1:3456:3456 -v subone-ci-data:/app/data -v subone-ci-templates:/app/templates subone:ci
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3456/api/auth/status | python3 -c 'import json, sys; assert json.load(sys.stdin)["authRequired"]'
      - name: Show container logs and clean up
        if: always()
        run: |
          docker logs subone-ci || true
          docker rm -f subone-ci || true
          docker volume rm subone-ci-data subone-ci-templates || true
